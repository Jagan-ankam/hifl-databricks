name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (PySpark ${{ matrix.pyspark }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pyspark: "3.5.3"   # Databricks Runtime 14.3 / 15.4 LTS
          - python: "3.12"
            pyspark: "4.0.1"   # Databricks Runtime 17.x / serverless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "pyspark==${{ matrix.pyspark }}" pytest
          pip install -e .
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts --select E,F,W,B --ignore E501
